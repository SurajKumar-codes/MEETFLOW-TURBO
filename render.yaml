# Render Blueprint for MeetFlow Turbo
# Docs: https://render.com/docs/blueprint-spec
#
# This provisions:
#   - a managed PostgreSQL database
#   - the Express backend (apps/http-backend)
#   - the Next.js frontend (apps/web)
#
# After the first deploy you MUST fill in the env vars marked `sync: false`
# (Stream + Google credentials) and the two cross-service URLs
# (NEXT_PUBLIC_API_URL, CLIENT_ORIGINS, NEXTAUTH_URL) in the Render dashboard.

databases:
  - name: meetflow-db
    plan: free
    databaseName: meetflow
    postgresMajorVersion: "16"

services:
  # ----------------------------------------------------------------------------
  # Express backend
  # ----------------------------------------------------------------------------
  - type: web
    name: meetflow-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @repo/db exec prisma generate &&
      pnpm --filter @repo/db exec prisma migrate deploy &&
      pnpm --filter @repo/http-backend build
    startCommand: pnpm --filter @repo/http-backend start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: meetflow-db
          property: connectionString
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_SECRET_KEY
        sync: false
      # Shared secret used to verify the JWT minted by the web app.
      # Generated here; the web service copies it via fromService below.
      - key: BACKEND_JWT_SECRET
        generateValue: true
      # Comma-separated list of allowed browser origins.
      # Set this to your frontend URL, e.g. https://meetflow-web.onrender.com
      - key: CLIENT_ORIGINS
        sync: false

  # ----------------------------------------------------------------------------
  # Next.js frontend
  # ----------------------------------------------------------------------------
  - type: web
    name: meetflow-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @repo/db exec prisma generate &&
      pnpm --filter web build
    startCommand: pnpm --filter web start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: meetflow-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Must match the backend's BACKEND_JWT_SECRET — pulled from that service.
      - key: BACKEND_JWT_SECRET
        fromService:
          type: web
          name: meetflow-backend
          envVarKey: BACKEND_JWT_SECRET
      # Public URL of THIS web service, e.g. https://meetflow-web.onrender.com
      - key: NEXTAUTH_URL
        sync: false
      # Public URL of the backend service, e.g. https://meetflow-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_STREAM_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
